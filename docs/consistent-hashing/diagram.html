<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Architecture Diagram</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0f0f0f;
    color: #e0e0e0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .diagram-title {
    text-align: center;
    padding: 16px 16px 4px;
    font-size: 1.2rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #ffffff;
    text-shadow: 0 0 30px rgba(108, 99, 255, 0.25);
    flex-shrink: 0;
  }

  .canvas-wrap {
    flex: 1;
    width: 100%;
    overflow: auto;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 8px 12px;
  }

  svg.diagram-svg {
    display: block;
  }

  /* ── Nodes ── */
  .node-group { cursor: pointer; }

  .node-rect {
    rx: 8; ry: 8;
    stroke-width: 1.5;
    transition: filter 0.25s, stroke-width 0.25s;
  }

  .node-group:hover .node-rect,
  .node-group.highlighted .node-rect {
    stroke-width: 2.5;
    filter: drop-shadow(0 0 10px var(--node-color));
  }

  .node-group.dimmed { opacity: 0.12; transition: opacity 0.3s; }
  .node-group:not(.dimmed) { transition: opacity 0.3s; }

  .node-icon {
    font-size: 13px;
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
  }

  .node-label {
    fill: #ffffff;
    font-size: 10.5px;
    font-weight: 600;
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
  }

  /* ── Edges ── */
  .edge-path {
    stroke: #555;
    stroke-width: 1.2;
    fill: none;
    transition: stroke 0.25s, stroke-width 0.25s;
    marker-end: url(#arrowhead);
  }

  .edge-path.highlighted {
    stroke: #6c63ff;
    stroke-width: 2;
    stroke-dasharray: 6 3;
    animation: dash-flow 0.6s linear infinite;
    marker-end: url(#arrowhead-hl);
  }

  .edge-path.dimmed { opacity: 0.06; transition: opacity 0.3s; }

  @keyframes dash-flow { to { stroke-dashoffset: -9; } }

  .edge-label {
    fill: #888;
    font-size: 8px;
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
  }
  .edge-label.highlighted { fill: #bbb; }
  .edge-label.dimmed { opacity: 0.06; }

  .edge-label-bg {
    fill: #0f0f0f;
    opacity: 0.85;
  }
  .edge-label-bg.dimmed { opacity: 0.06; }

  /* ── Groups ── */
  .group-rect {
    fill: rgba(255,255,255,0.018);
    stroke: rgba(255,255,255,0.12);
    stroke-dasharray: 5 3;
    rx: 10; ry: 10;
  }
  .group-label {
    fill: rgba(255,255,255,0.35);
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  /* ── Tooltip ── */
  .tooltip {
    position: fixed;
    background: #1a1a2e;
    border: 1px solid rgba(108,99,255,0.4);
    border-radius: 10px;
    padding: 12px 16px;
    max-width: 280px;
    pointer-events: none;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.2s, transform 0.2s;
    z-index: 100;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  }
  .tooltip.visible { opacity: 1; transform: translateY(0); }
  .tooltip-title { font-weight: 700; font-size: 0.85rem; margin-bottom: 4px; color: #fff; }
  .tooltip-type {
    display: inline-block; font-size: 0.6rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.06em;
    padding: 2px 7px; border-radius: 4px; margin-bottom: 6px;
  }
  .tooltip-desc { font-size: 0.75rem; line-height: 1.45; color: #bbb; }

  /* ── Legend ── */
  .legend {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 10px; padding: 6px 16px 10px; flex-shrink: 0;
  }
  .legend-item {
    display: flex; align-items: center; gap: 4px;
    font-size: 0.6rem; color: #777; text-transform: capitalize;
  }
  .legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
</style>
</head>
<body>

<div class="diagram-title" id="diagramTitle"></div>
<div class="canvas-wrap">
  <svg class="diagram-svg" id="svgCanvas" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrowhead" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
        <polygon points="0 0, 7 2.5, 0 5" fill="#555" />
      </marker>
      <marker id="arrowhead-hl" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
        <polygon points="0 0, 7 2.5, 0 5" fill="#6c63ff" />
      </marker>
    </defs>
  </svg>
</div>
<div class="legend" id="legend"></div>

<div class="tooltip" id="tooltip">
  <div class="tooltip-title" id="tooltipTitle"></div>
  <span class="tooltip-type" id="tooltipType"></span>
  <div class="tooltip-desc" id="tooltipDesc"></div>
</div>

<script>
const TYPE_COLORS = {
  client:'#6c63ff', server:'#4ecdc4', database:'#ff6b6b', cache:'#ffd93d',

  monitoring:'#45b7d1'
};
const TYPE_ICONS = {

const DATA = {
  "title": "Consistent Hashing Architecture",
  "nodes": [

      "description": "Circular continuum (0 to 2^128) where both keys and virtual nodes are mapped using consistent hash function."
    },

      "type": "database",
      "description": "Sorted data structure (TreeMap/sorted array) storing all virtual node positions for O(log N) binary search lookup."

    },
    {
      "id": "physical_node_2",
      "label": "Physical Node 2",
      "type": "server",
      "description": "Actual server owning multiple virtual nodes on the ring, storing partitioned data and serving requests."
    },
    {
      "id": "physical_node_3",
      "label": "Physical Node 3",
      "type": "server",
      "description": "Actual server owning multiple virtual nodes on the ring, storing partitioned data and serving requests."
    },
    {
      "id": "vnodes",
      "label": "Virtual Nodes",
      "type": "service",
      "description": "100-256 virtual positions per physical node on the ring to ensure statistically balanced load distribution."
    },
    {
      "id": "membership_service",
      "label": "Membership/Gossip Service",
      "type": "service",
      "description": "Maintains ring state across cluster using gossip protocol (e.g., SWIM), coordinates membership changes."
    },
    {

      "label": "Health Checker",
      "type": "monitoring",
      "description": "Detects node failures and triggers key remapping to successor nodes on the ring."
    },
    {
      "id": "hash_function",

      "type": "service",
      "description": "Fast non-cryptographic hash (MurmurHash3/xxHash) mapping keys and nodes to ring positions."
    },
    {
      "id": "replica_nodes",
      "label": "Replica Nodes",
      "type": "storage",
      "description": "N successor nodes on the ring storing replicated data for fault tolerance and availability."
    },
    {
      "id": "data_store",
      "label": "Data Partitions",
      "type": "storage",
      "description": "Actual data ranges owned by virtual nodes, distributed across physical servers."
    }
  ],
  "edges": [
    {
      "from": "client",

    },

    },

    },

    },
    {

      "label": "Route to owner"
    },
    {

      "label": "Route to owner"
    },

      "label": "Replicate to N nodes"
    },
    {

    },
    {

/* ─── Group-aware layout engine ─── */
function layoutNodes(nodes, edges, groups) {
  const nodeW = 150, nodeH = 42;
  const hGap = 30, vGap = 55;
  const groupPadX = 20, groupPadY = 28, groupLabelH = 18;
  const canvasPad = 30;

  // Build group membership map
  const nodeGroup = {};  // nodeId → groupIndex
  (groups || []).forEach((g, gi) => {
    (g.nodeIds || []).forEach(nid => { nodeGroup[nid] = gi; });
  });

  // Adjacency
  const outgoing = {}, incoming = {};
  nodes.forEach(n => { outgoing[n.id] = []; incoming[n.id] = []; });
  edges.forEach(e => {
    if (outgoing[e.from]) outgoing[e.from].push(e.to);
    if (incoming[e.to]) incoming[e.to].push(e.from);
  });

  // If groups exist, lay out by group rows
  // Each group becomes a row, arranged top-to-bottom
  // Within each group, nodes arranged left-to-right
  // Ungrouped nodes get their own row at the end

  const positions = {};

  if (groups && groups.length > 0) {
    let currentY = canvasPad;
    let maxW = 0;

    const groupBounds = []; // for drawing group boxes later

    groups.forEach((g, gi) => {
      const gNodes = (g.nodeIds || []).map(id => nodes.find(n => n.id === id)).filter(Boolean);
      if (gNodes.length === 0) return;

      const rowTop = currentY;
      const nodesY = rowTop + groupLabelH + groupPadY;
      const rowW = gNodes.length * nodeW + (gNodes.length - 1) * hGap;
      if (rowW > maxW) maxW = rowW;

      gNodes.forEach((n, i) => {
        positions[n.id] = {
          x: groupPadX + i * (nodeW + hGap),
          y: nodesY,
          w: nodeW,
          h: nodeH
        };
      });

      groupBounds.push({
        gi, label: g.label,
        top: rowTop,
        bottom: nodesY + nodeH + groupPadY,
        nodeCount: gNodes.length
      });

      currentY = nodesY + nodeH + groupPadY + vGap;
    });

    // Ungrouped nodes
    const ungrouped = nodes.filter(n => nodeGroup[n.id] === undefined);
    if (ungrouped.length > 0) {
      const rowW = ungrouped.length * nodeW + (ungrouped.length - 1) * hGap;
      if (rowW > maxW) maxW = rowW;
      ungrouped.forEach((n, i) => {
        positions[n.id] = {
          x: groupPadX + i * (nodeW + hGap),
          y: currentY,
          w: nodeW,
          h: nodeH
        };
      });
      currentY += nodeH + vGap;
    }

    // Now center each row horizontally
    const totalW = maxW + groupPadX * 2 + canvasPad * 2;

    groups.forEach(g => {
      const gNodes = (g.nodeIds || []).map(id => nodes.find(n => n.id === id)).filter(Boolean);
      if (gNodes.length === 0) return;
      const rowW = gNodes.length * nodeW + (gNodes.length - 1) * hGap;
      const offsetX = (totalW - rowW) / 2 - groupPadX;
      gNodes.forEach(n => {
        if (positions[n.id]) positions[n.id].x += offsetX;
      });
    });

    if (ungrouped.length > 0) {
      const rowW = ungrouped.length * nodeW + (ungrouped.length - 1) * hGap;
      const offsetX = (totalW - rowW) / 2 - groupPadX;
      ungrouped.forEach(n => {
        if (positions[n.id]) positions[n.id].x += offsetX;
      });
    }

    const canvasW = totalW;
    const canvasH = currentY - vGap + canvasPad;
    return { positions, canvasW, canvasH };

  } else {
    // No groups — use BFS layering
    const layers = {};
    const roots = nodes.filter(n => incoming[n.id].length === 0).map(n => n.id);
    if (roots.length === 0 && nodes.length > 0) roots.push(nodes[0].id);

    const visited = new Set();
    let queue = roots.map(id => ({ id, layer: 0 }));
    let maxLayer = 0;

    while (queue.length > 0) {
      const next = [];
      for (const { id, layer } of queue) {
        if (visited.has(id)) continue;
        visited.add(id);
        layers[id] = Math.max(layers[id] || 0, layer);
        if (layers[id] > maxLayer) maxLayer = layers[id];
        for (const child of (outgoing[id] || [])) {
          if (!visited.has(child)) next.push({ id: child, layer: layers[id] + 1 });
        }
      }
      queue = next;
    }

    nodes.forEach(n => {
      if (!visited.has(n.id)) { maxLayer++; layers[n.id] = maxLayer; }
    });

    const buckets = {};
    nodes.forEach(n => {
      const l = layers[n.id] || 0;
      if (!buckets[l]) buckets[l] = [];
      buckets[l].push(n);
    });

    const maxBucketSize = Math.max(...Object.values(buckets).map(b => b.length), 1);
    const canvasW = maxBucketSize * (nodeW + hGap) - hGap + canvasPad * 2;
    const canvasH = (maxLayer + 1) * (nodeH + vGap) - vGap + canvasPad * 2;

    Object.entries(buckets).forEach(([l, bucket]) => {
      const layerIdx = parseInt(l);
      const y = canvasPad + layerIdx * (nodeH + vGap);
      const totalW = bucket.length * nodeW + (bucket.length - 1) * hGap;
      const startX = (canvasW - totalW) / 2;
      bucket.forEach((n, i) => {
        positions[n.id] = { x: startX + i * (nodeW + hGap), y, w: nodeW, h: nodeH };
      });
    });

    return { positions, canvasW, canvasH };
  }
}

/* ── SVG helpers ── */
const svgNS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs) {
  const el = document.createElementNS(svgNS, tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

/* ── Edge path with bezier curves ── */
function edgePath(from, to) {
  const cx1 = from.x + from.w / 2, cy1 = from.y + from.h / 2;
  const cx2 = to.x + to.w / 2, cy2 = to.y + to.h / 2;

  // Determine which sides to connect
  let x1, y1, x2, y2;

  if (Math.abs(cy2 - cy1) > Math.abs(cx2 - cx1) * 0.3) {
    // Primarily vertical — connect bottom→top
    if (cy2 > cy1) {
      x1 = cx1; y1 = from.y + from.h;
      x2 = cx2; y2 = to.y;
    } else {
      x1 = cx1; y1 = from.y;
      x2 = cx2; y2 = to.y + to.h;
    }
  } else {
    // Primarily horizontal — connect right→left
    if (cx2 > cx1) {
      x1 = from.x + from.w; y1 = cy1;
      x2 = to.x; y2 = cy2;
    } else {
      x1 = from.x; y1 = cy1;
      x2 = to.x + to.w; y2 = cy2;
    }
  }

  const dx = x2 - x1, dy = y2 - y1;
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;

  // Curve control points
  let d;
  if (Math.abs(dy) > Math.abs(dx) * 0.5) {
    d = `M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`;
  } else {
    d = `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`;
  }

  return { d, mx, my };
}

/* ── Truncate long labels ── */
function truncLabel(text, maxLen) {
  return text.length > maxLen ? text.slice(0, maxLen - 1) + '…' : text;
}

/* ── Render ── */
function render() {
  const svg = document.getElementById('svgCanvas');
  const title = document.getElementById('diagramTitle');
  const legend = document.getElementById('legend');
  const tooltip = document.getElementById('tooltip');

  title.textContent = DATA.title || 'Architecture Diagram';

  const { positions, canvasW, canvasH } = layoutNodes(DATA.nodes, DATA.edges, DATA.groups || []);
  svg.setAttribute('viewBox', `0 0 ${canvasW} ${canvasH}`);
  svg.style.width = Math.min(canvasW, 1200) + 'px';
  svg.style.height = (Math.min(canvasW, 1200) / canvasW * canvasH) + 'px';

  // ── Groups ──
  (DATA.groups || []).forEach(g => {
    const pts = (g.nodeIds || []).map(id => positions[id]).filter(Boolean);
    if (!pts.length) return;
    const pad = 18;
    const x = Math.min(...pts.map(p => p.x)) - pad;
    const y = Math.min(...pts.map(p => p.y)) - pad - 16;  // extra space for label
    const x2 = Math.max(...pts.map(p => p.x + p.w)) + pad;
    const y2 = Math.max(...pts.map(p => p.y + p.h)) + pad;

    svg.appendChild(svgEl('rect', {
      class:'group-rect', x, y, width: x2-x, height: y2-y
    }));
    const lbl = svgEl('text', { class:'group-label', x: x+10, y: y+13 });
    lbl.textContent = g.label;
    svg.appendChild(lbl);
  });

  // ── Edges ──
  const edgeEls = [];
  DATA.edges.forEach(e => {
    const f = positions[e.from], t = positions[e.to];
    if (!f || !t) return;

    const { d, mx, my } = edgePath(f, t);
    const path = svgEl('path', {
      class:'edge-path', d, fill:'none', 'data-from': e.from, 'data-to': e.to
    });
    svg.appendChild(path);
    edgeEls.push({ el: path, from: e.from, to: e.to });

    if (e.label) {
      const txtLen = e.label.length * 4.5 + 8;
      const bg = svgEl('rect', {
        class:'edge-label-bg',
        x: mx - txtLen/2, y: my - 7,
        width: txtLen, height: 13, rx: 3
      });
      svg.appendChild(bg);
      edgeEls.push({ el: bg, from: e.from, to: e.to, isLabel: true });

      const lbl = svgEl('text', {
        class:'edge-label', x: mx, y: my,
        'data-from': e.from, 'data-to': e.to
      });
      lbl.textContent = e.label;
      svg.appendChild(lbl);
      edgeEls.push({ el: lbl, from: e.from, to: e.to, isLabel: true });
    }
  });

  // ── Nodes ──
  const nodeEls = {};
  DATA.nodes.forEach(n => {
    const pos = positions[n.id];
    if (!pos) return;
    const color = TYPE_COLORS[n.type] || '#888';
    const icon = TYPE_ICONS[n.type] || '●';

    const g = svgEl('g', {
      class:'node-group', 'data-id': n.id, style: `--node-color:${color}`
    });

    g.appendChild(svgEl('rect', {
      class:'node-rect', x: pos.x, y: pos.y,
      width: pos.w, height: pos.h,
      fill: color + '15', stroke: color
    }));

    const iconEl = svgEl('text', {
      class:'node-icon', x: pos.x + 16, y: pos.y + pos.h / 2
    });
    iconEl.textContent = icon;
    g.appendChild(iconEl);

    const labelEl = svgEl('text', {
      class:'node-label', x: pos.x + pos.w / 2 + 8, y: pos.y + pos.h / 2
    });
    labelEl.textContent = truncLabel(n.label, 22);
    g.appendChild(labelEl);

    svg.appendChild(g);
    nodeEls[n.id] = { el: g, data: n };
  });

  // ── Interactions ──
  const adj = {};
  DATA.nodes.forEach(n => adj[n.id] = new Set());
  DATA.edges.forEach(e => {
    if (adj[e.from]) adj[e.from].add(e.to);
    if (adj[e.to]) adj[e.to].add(e.from);
  });

  function highlight(nodeId) {
    const nbrs = adj[nodeId] || new Set();
    Object.keys(nodeEls).forEach(id => {
      const el = nodeEls[id].el;
      if (id === nodeId || nbrs.has(id)) {
        el.classList.add('highlighted'); el.classList.remove('dimmed');
      } else {
        el.classList.remove('highlighted'); el.classList.add('dimmed');
      }
    });
    edgeEls.forEach(ee => {
      if (ee.from === nodeId || ee.to === nodeId) {
        ee.el.classList.add('highlighted'); ee.el.classList.remove('dimmed');
      } else {
        ee.el.classList.remove('highlighted'); ee.el.classList.add('dimmed');
      }
    });
  }

  function clearHL() {
    Object.values(nodeEls).forEach(ne => ne.el.classList.remove('highlighted','dimmed'));
    edgeEls.forEach(ee => ee.el.classList.remove('highlighted','dimmed'));
  }

  Object.keys(nodeEls).forEach(id => {
    const g = nodeEls[id].el;
    g.addEventListener('mouseenter', () => highlight(id));
    g.addEventListener('mouseleave', () => clearHL());
    g.addEventListener('click', evt => {
      evt.stopPropagation();
      const n = nodeEls[id].data;
      const c = TYPE_COLORS[n.type] || '#888';
      document.getElementById('tooltipTitle').textContent = n.label;
      const te = document.getElementById('tooltipType');
      te.textContent = n.type; te.style.background = c+'30'; te.style.color = c;
      document.getElementById('tooltipDesc').textContent = n.description || '';
      tooltip.style.left = Math.min(evt.clientX+12, window.innerWidth-300)+'px';
      tooltip.style.top = Math.min(evt.clientY+12, window.innerHeight-140)+'px';
      tooltip.classList.add('visible');
    });
  });

  document.addEventListener('click', () => tooltip.classList.remove('visible'));

  // ── Legend ──
  const usedTypes = [...new Set(DATA.nodes.map(n => n.type))];
  usedTypes.forEach(type => {
    const c = TYPE_COLORS[type] || '#888';
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:${c}"></span>${type}`;
    legend.appendChild(item);
  });
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', render);
else render();
</script>
</body>
</html>
